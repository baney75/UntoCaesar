name: plugin

on:
  push:
    branches: [main, spec/plugin-v0]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every action is pinned to a commit
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/.github/workflows"
          if grep -nE '^[ -]*"?uses"? *:' *.y*ml | sed 's/ #.*//' | grep -vE 'uses"? *: *(\./|baney75/|[^ ]+@[0-9a-f]{40} *$)'; then exit 1; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: PYTHON=python tests/plugin/check.sh
      - run: python -m pip install "pytest>=8"
      - run: python -m pytest -q
