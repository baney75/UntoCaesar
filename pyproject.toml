[project]
name = "untocaesar"
version = "0.1.0"
description = "UntoCaesar's caesar CLI: a federal Form 1040 engine for tax year 2025 (v0 scope). Test build: synthetic cases only, not for real records."
readme = "README.md"
requires-python = ">=3.11"
# caesar uses only the Python standard library at run time.
dependencies = []

[project.scripts]
caesar = "caesar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caesar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
